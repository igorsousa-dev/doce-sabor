                const catElement = document.createElement('div');
                catElement.className = 'bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-slate-100';

                let itemsHTML = filteredItems.map(item => {
                    let priceButtons = item.prices.map((p, idx) => {
                        const cartKey = `${item.id}-${idx}`;
                        const qty = cart[cartKey] ? cart[cartKey].qty : 0;

                        return `
                            <div class="flex items-center justify-between bg-slate-50 border border-slate-200/80 rounded-2xl p-2.5 mt-2">
                                <div>
                                    <span class="text-xs font-bold text-slate-700 block">${p.label}</span>
                                    <span class="text-sm font-extrabold text-brand-600">R$ ${p.val.toFixed(2).replace('.', ',')}</span>
                                </div>
                                
                                ${qty === 0 ? `
                                    <button onclick="addToCart('${item.id}', ${idx})" class="bg-brand-500 hover:bg-brand-600 active:scale-95 text-white text-xs font-bold px-3 py-2 rounded-xl transition flex items-center space-x-1 shadow-sm">
                                        <i data-lucide="plus" class="w-4 h-4"></i>
                                        <span>Adicionar</span>
                                    </button>
                                ` : `
                                    <div class="flex items-center space-x-2 bg-brand-500 text-white rounded-xl p-1 shadow-sm">
                                        <button onclick="updateQty('${cartKey}', -1)" class="w-7 h-7 flex items-center justify-center hover:bg-black/10 rounded-lg font-bold">-</button>
                                        <span class="text-xs font-extrabold w-4 text-center">${qty}</span>
                                        <button onclick="updateQty('${cartKey}', 1)" class="w-7 h-7 flex items-center justify-center hover:bg-black/10 rounded-lg font-bold">+</button>
                                    </div>
                                `}
                            </div>
                        `;
                    }).join('');

                    return `
                        <div class="py-3.5 border-b border-slate-100 last:border-b-0">
                            <h4 class="font-bold text-slate-800 text-sm sm:text-base leading-snug">${item.name}</h4>
                            <p class="text-xs text-slate-500 mt-0.5">${item.desc}</p>
                            <div class="mt-2 space-y-1">
                                ${priceButtons}
                            </div>
                        </div>
                    `;
                }).join('');

                catElement.innerHTML = `
                    <div class="mb-4">
                        <h3 class="text-lg font-extrabold text-slate-900 flex items-center gap-2">${cat.title}</h3>
                        <p class="text-xs text-slate-500 font-medium">${cat.subtitle}</p>
                    </div>
                    <div class="divide-y divide-slate-100">
                        ${itemsHTML}
                    </div>
                `;

                container.appendChild(catElement);
            });

            if (container.children.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-3xl p-6 border border-slate-100">
                        <span class="text-4xl block mb-2">🔍</span>
                        <h3 class="font-bold text-slate-800">Nenhum item encontrado</h3>
                        <p class="text-xs text-slate-500 mt-1">Tente pesquisar outro termo ou navegar pelas categorias.</p>
                    </div>
                `;
            }

            lucide.createIcons();
        }

        // Add to Cart
        function addToCart(itemId, priceIdx) {
            let itemObj = null;
            menuData.forEach(c => {
                c.items.forEach(i => {
                    if (i.id === itemId) itemObj = i;
                });
            });

            if (!itemObj) return;

            const cartKey = `${itemId}-${priceIdx}`;
            cart[cartKey] = {
                item: itemObj,
                priceObj: itemObj.prices[priceIdx],
                qty: 1
            };

            updateCartUI();
            renderMenu();
        }

        // Update Quantity
        function updateQty(cartKey, delta) {
            if (!cart[cartKey]) return;

            cart[cartKey].qty += delta;
            if (cart[cartKey].qty <= 0) {
                delete cart[cartKey];
            }

            updateCartUI();
            renderMenu();
            renderCartModalList();
        }

        // Category Filter
        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.dataset.cat === cat) {
                    btn.className = 'cat-btn active bg-brand-500 text-white font-semibold text-xs sm:text-sm px-4 py-2.5 rounded-xl shadow-sm whitespace-nowrap transition';
                } else {
                    btn.className = 'cat-btn bg-white text-slate-700 hover:bg-slate-100 font-semibold text-xs sm:text-sm px-4 py-2.5 rounded-xl border border-slate-200 whitespace-nowrap transition';
                }
            });
            renderMenu();
        }

        function filterMenu() {
            renderMenu();
        }

        // Update Cart Bottom Bar UI
        function updateCartUI() {
            let total = 0;
            let count = 0;

            Object.values(cart).forEach(entry => {
                total += entry.priceObj.val * entry.qty;
                count += entry.qty;
            });

            const cartBar = document.getElementById('cartBar');
            const cartTotalText = document.getElementById('cartTotalText');
            const modalTotalText = document.getElementById('modalTotalText');
            const cartCountBadge = document.getElementById('cartCountBadge');

            cartTotalText.innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
            modalTotalText.innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
            cartCountBadge.innerText = `${count} ${count === 1 ? 'item selecionado' : 'itens selecionados'}`;

            if (count > 0) {
                cartBar.classList.remove('translate-y-full');
            } else {
                cartBar.classList.add('translate-y-full');
                closeCartModal();
            }
        }

        // Cart Modal Render
        function renderCartModalList() {
            const listContainer = document.getElementById('cartItemsList');
            if (Object.keys(cart).length === 0) {
                listContainer.innerHTML = '<p class="text-center text-slate-400 text-sm py-8">Seu carrinho está vazio.</p>';
                return;
            }

            listContainer.innerHTML = Object.entries(cart).map(([key, entry]) => {
                const subtotal = entry.priceObj.val * entry.qty;
                return `
                    <div class="flex items-center justify-between pt-3 first:pt-0">
                        <div class="pr-2">
                            <h5 class="font-bold text-slate-800 text-sm leading-tight">${entry.item.name}</h5>
                            <p class="text-xs text-slate-500">${entry.priceObj.label} • R$ ${entry.priceObj.val.toFixed(2).replace('.', ',')}</p>
                            <span class="text-xs font-bold text-brand-600">Subtotal: R$ ${subtotal.toFixed(2).replace('.', ',')}</span>
                        </div>
                        <div class="flex items-center space-x-2 bg-slate-100 rounded-xl p-1">
                            <button onclick="updateQty('${key}', -1)" class="w-6 h-6 flex items-center justify-center bg-white rounded-lg shadow-sm font-bold text-slate-700 hover:bg-slate-200">-</button>
                            <span class="text-xs font-bold w-4 text-center">${entry.qty}</span>
                            <button onclick="updateQty('${key}', 1)" class="w-6 h-6 flex items-center justify-center bg-white rounded-lg shadow-sm font-bold text-slate-700 hover:bg-slate-200">+</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openCartModal() {
            renderCartModalList();
            const modal = document.getElementById('cartModal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function closeCartModal() {
            const modal = document.getElementById('cartModal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        // Config WhatsApp Number Modal
        function toggleConfigModal() {
            const modal = document.getElementById('configModal');
            document.getElementById('whatsappNumberInput').value = whatsappNumber;
            modal.classList.toggle('hidden');
        }

        function saveWhatsappNumber() {
            const inputVal = document.getElementById('whatsappNumberInput').value.replace(/\D/g, '');
            if (inputVal.length < 10) {
                alert('Por favor, digite um número de WhatsApp válido com DDD.');
                return;
            }
            whatsappNumber = inputVal;
            localStorage.setItem('doceSaborWhatsApp', whatsappNumber);
            toggleConfigModal();
            alert('Número do WhatsApp atualizado com sucesso!');
        }

        // Send Order to WhatsApp
        function sendOrderToWhatsApp() {
            if (Object.keys(cart).length === 0) return;

            const name = document.getElementById('customerName').value.trim() || 'Cliente';
            const delivery = document.getElementById('deliveryOption').value;
            const notes = document.getElementById('orderNotes').value.trim();

            let message = `🍓 *PEDIDO - DOCE SABOR* 🍓\n\n`;
            message += `👤 *Nome:* ${name}\n`;
            message += `📍 *Opção:* ${delivery}\n`;
            if (notes) message += `📝 *Obs:* ${notes}\n`;
            message += `\n📋 *ITENS DO PEDIDO:*\n`;

            let total = 0;
            Object.values(cart).forEach((entry, idx) => {
                const subtotal = entry.priceObj.val * entry.qty;
                total += subtotal;
                message += `${idx + 1}. *${entry.item.name}*\n   ↳ ${entry.qty}x ${entry.priceObj.label} = R$ ${subtotal.toFixed(2).replace('.', ',')}\n`;
            });

            message += `\n💰 *TOTAL:* R$ ${total.toFixed(2).replace('.', ',')}\n\n`;
            message += `Obrigado! Aguardo a confirmação do pedido.`;

            const encodedMessage = encodeURIComponent(message);
            const waUrl = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;

            window.open(waUrl, '_blank');
        }

        // Initialize App
        window.onload = function() {
            renderMenu();
            lucide.createIcons();
        };
    </script>
</body>
</html>
